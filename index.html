<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Farmácia da Família</title>
<meta name="theme-color" content="#3F6F5A" />
<link rel="manifest" href="/manifest.json" />
<link rel="apple-touch-icon" href="/icon-192.png" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap');

  :root {
    --bg: #F6F4EE;
    --card: #FFFFFF;
    --ink: #26312B;
    --ink-soft: #5B6960;
    --line: #DCD6C6;
    --green: #3F6F5A;
    --green-soft: #E7EFE9;
    --amber: #B9832E;
    --amber-soft: #F5EBD8;
    --red: #AE3E31;
    --red-soft: #F5E1DD;
    --cream: #EFEADD;
    --font-serif: 'Fraunces', Georgia, serif;
    --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); font-family: var(--font-sans); }
  body { min-height: 100vh; padding-bottom: 40px; }
  input, select, textarea, button { font-family: var(--font-sans); }
  input::placeholder, textarea::placeholder { color: #9A9384; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--green); outline-offset: 1px; }
  button { cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
  .header { position: sticky; top: 0; z-index: 10; background: var(--bg); border-bottom: 1px solid var(--line); padding: 18px 16px 14px; }
  .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-icon { width: 34px; height: 34px; border-radius: 9px; background: var(--green); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  h1 { font-family: var(--font-serif); font-weight: 600; font-size: 22px; margin: 0; letter-spacing: -0.01em; }
  .subtitle { margin: 1px 0 0; font-size: 11.5px; color: var(--ink-soft); }
  .btn-add { background: var(--green); color: #fff; border: none; border-radius: 10px; width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; font-size: 22px; line-height: 1; }
  .stats { display: flex; gap: 8px; margin-bottom: 12px; }
  .stat-pill { flex: 1; border-radius: 10px; padding: 8px 10px; text-align: center; }
  .stat-value { font-family: var(--font-serif); font-size: 19px; font-weight: 700; line-height: 1.1; }
  .stat-label { font-size: 10.5px; opacity: 0.85; margin-top: 2px; }
  .symptom-box { background: var(--green-soft); border: 1px solid rgba(63,111,90,0.13); border-radius: 12px; padding: 12px 12px 10px; margin-bottom: 12px; }
  .symptom-label { display: block; font-size: 12.5px; font-weight: 600; color: var(--green); margin-bottom: 6px; }
  .symptom-input-wrap { position: relative; margin-bottom: 8px; }
  .symptom-input-wrap input { width: 100%; padding: 9px 34px 9px 12px; border-radius: 9px; border: 1px solid var(--line); background: var(--card); font-size: 14px; color: var(--ink); }
  .symptom-clear { position: absolute; right: 6px; top: 6px; background: none; border: none; padding: 4px; color: var(--ink-soft); }
  .chip-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border: 1px solid rgba(63,111,90,0.35); background: var(--card); color: var(--green); border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 500; }
  .search-wrap { position: relative; margin-bottom: 10px; }
  .search-wrap input { width: 100%; padding: 9px 12px 9px 34px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); font-size: 14px; color: var(--ink); }
  .search-icon { position: absolute; left: 11px; top: 10px; color: var(--ink-soft); }
  .filters { display: flex; gap: 6px; }
  .filter-btn { border: 1px solid var(--line); background: var(--card); color: var(--ink-soft); border-radius: 999px; padding: 6px 13px; font-size: 13px; font-weight: 500; }
  .filter-btn.active { border-color: var(--green); background: var(--green); color: #fff; }
  .body { padding: 14px 16px 100px; }
  .error-banner { background: var(--red-soft); color: var(--red); padding: 9px 12px; border-radius: 8px; font-size: 13px; margin-bottom: 12px; }
  .loading, .empty { text-align: center; padding: 50px 20px; color: var(--ink-soft); }
  .empty p { font-size: 14.5px; margin: 0 0 14px; }
  .empty-btn { background: var(--green); color: #fff; border: none; border-radius: 10px; padding: 10px 18px; font-size: 14px; font-weight: 600; }
  .hint-line { font-size: 13px; color: var(--ink-soft); margin-bottom: 10px; }
  .med-list { display: flex; flex-direction: column; gap: 10px; }
  .med-card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 13px 14px; }
  .med-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .med-name { font-family: var(--font-serif); font-weight: 600; font-size: 16.5px; margin-bottom: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .med-sub { font-size: 13px; color: var(--ink-soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .med-actions { display: flex; gap: 4px; flex-shrink: 0; }
  .icon-btn { background: none; border: none; padding: 6px; border-radius: 7px; color: var(--ink-soft); }
  .tag-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .tag { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 3px 9px; font-size: 12px; font-weight: 500; }
  .med-notes { font-size: 13px; color: var(--ink-soft); margin-top: 8px; font-style: italic; }
  .overlay { position: fixed; inset: 0; background: rgba(38,49,43,0.45); display: flex; align-items: flex-end; justify-content: center; z-index: 30; }
  .overlay.center { align-items: center; padding: 24px; }
  .sheet { background: var(--bg); width: 100%; max-width: 480px; max-height: 92vh; overflow-y: auto; border-radius: 18px 18px 0 0; padding: 16px 18px 22px; }
  .sheet-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .sheet-header h2 { font-family: var(--font-serif); font-size: 19px; font-weight: 600; margin: 0; }
  .close-btn { background: none; border: none; padding: 4px; color: var(--ink-soft); }
  .form-col { display: flex; flex-direction: column; gap: 12px; }
  .form-row { display: flex; gap: 10px; }
  .field { flex: 1; }
  .field label { display: block; font-size: 12.5px; color: var(--ink-soft); margin-bottom: 4px; font-weight: 500; }
  .field input, .field select, .field textarea { width: 100%; padding: 9px 11px; border-radius: 8px; border: 1px solid var(--line); background: #fff; font-size: 14px; color: var(--ink); }
  .submit-btn { margin-top: 6px; width: 100%; background: var(--green); color: #fff; border: none; border-radius: 10px; padding: 12px 0; font-size: 15px; font-weight: 600; }
  .submit-btn:disabled { background: #B7C4BC; cursor: not-allowed; }
  .confirm-card { background: var(--card); border-radius: 14px; padding: 20px; max-width: 320px; width: 100%; }
  .confirm-card p { margin: 0 0 16px; font-size: 14.5px; }
  .confirm-actions { display: flex; gap: 8px; }
  .confirm-actions button { flex: 1; padding: 9px 0; border-radius: 8px; font-size: 14px; }
  .btn-cancel { border: 1px solid var(--line); background: #fff; color: var(--ink); }
  .btn-danger { border: none; background: var(--red); color: #fff; font-weight: 600; }
  svg { display: block; }
</style>
</head>
<body>
  <div id="app"></div>
  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="app.js"></script>
</body>
</html>
